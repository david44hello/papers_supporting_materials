# NagataHigmanLean — Lean 4 proof of the Nagata–Higman index paper (Dave Goel, short paper v1.03).
name = "NagataHigmanLean"
version = "0.1.0"
defaultTargets = ["NagataHigman"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "NagataHigman"
globs = ["NagataHigman", "NagataHigman.+"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }
weakLeanArgs = ["-j1"]
