# MatsaevLean — Lean 4 proof of Theorem A of "Matsaev's (1971) conjecture is false for every p != 2" (Dave Goel).
name = "MatsaevLean"
version = "0.1.0"
defaultTargets = ["Matsaev"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "Matsaev"
globs = ["Matsaev", "Matsaev.+"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }
weakLeanArgs = ["-j1"]
