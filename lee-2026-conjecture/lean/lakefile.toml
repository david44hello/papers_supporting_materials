# LeeDiamLean — Lean formalization of "The Lee (2026) conjecture on the diameters of order and chain polytopes fails in
# both directions" (Dave Goel).
name = "LeeDiamLean"
version = "0.1.0"
defaultTargets = ["LeeDiam"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "LeeDiam"
globs = ["LeeDiam", "LeeDiam.+"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }
weakLeanArgs = ["-j1"]
