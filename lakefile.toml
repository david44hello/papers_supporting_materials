name = "HibiLiLean"
version = "0.1.0"
defaultTargets = ["HibiLi"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "HibiLi"
globs = ["HibiLi", "HibiLi.+"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }
weakLeanArgs = ["-j1"]

